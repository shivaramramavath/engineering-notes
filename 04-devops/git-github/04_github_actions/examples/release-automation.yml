# =============================================================================
# Release automation: tag -> test -> build -> GitHub Release
# -----------------------------------------------------------------------------
# Copy to: .github/workflows/release.yml
# Chapter: 15_cd-and-deployment.md
#
# How to release
#   1. Bump "version" in package.json and merge to main  (e.g. 1.4.0)
#   2. git tag v1.4.0 && git push origin v1.4.0
#   3. This workflow builds, packages, and publishes a GitHub Release with
#      auto-generated notes and a checksum file.
#
# Tags containing a hyphen (v1.4.0-rc.1, v2.0.0-beta.2) are published as
# pre-releases.
# =============================================================================

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read                  # widened only for the job that publishes

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false       # never cancel a release midway

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Safety check: the tag must match package.json, or we stop here.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          tar -czf "release/app-${TAG}.tgz" dist/
          (cd release && sha256sum "app-${TAG}.tgz" > SHA256SUMS.txt)
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          retention-days: 7

  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write             # required to create a release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}     # lets gh run without a checkout
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Create release
        run: |
          FLAGS=""
          # Hyphen in the tag (v1.4.0-rc.1) means pre-release
          if [[ "$TAG" == *-* ]]; then
            FLAGS="--prerelease"
          fi

          gh release create "$TAG" \
            release/* \
            --title "$TAG" \
            --generate-notes \
            $FLAGS

      - name: Summary
        run: |
          {
            echo "### Released $TAG"
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Optional: publish to npm after the release exists.
  # Uncomment, add an NPM_TOKEN secret (use an environment for protection).
  #
  # npm:
  #   name: Publish to npm
  #   needs: release
  #   runs-on: ubuntu-latest
  #   environment: npm
  #   permissions:
  #     contents: read
  #     id-token: write           # for --provenance
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         registry-url: https://registry.npmjs.org
  #     - run: npm ci
  #     - run: npm publish --provenance --access public
  #       env:
  #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
